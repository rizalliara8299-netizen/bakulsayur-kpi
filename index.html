  <style>
    :root { --brand:#057b4f; --sidebar:#212120; --cyan:#37b9ef; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#f4f7fb; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .app-frame { position:fixed; inset:0; width:100%; height:100%; border:0; background:#f4f7fb; }
    .brand-overlay { position:fixed; z-index:80; top:0; left:0; width:260px; height:96px; display:flex; align-items:center; padding:14px 24px; pointer-events:none; background:var(--sidebar); }
    .brand-overlay img { width:182px; height:68px; object-fit:contain; object-position:left center; }
    .loader { position:fixed; z-index:9999; inset:0; display:grid; place-items:center; padding:24px; background:linear-gradient(145deg,#f7fbf9 0%,#eef8f3 52%,#e6f5fb 100%); transition:opacity .28s ease,visibility .28s ease; }
    .loader.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .loader-card { width:min(390px,100%); padding:34px 30px 28px; text-align:center; border:1px solid rgba(5,123,79,.12); border-radius:26px; background:rgba(255,255,255,.94); box-shadow:0 24px 70px rgba(13,69,48,.13); backdrop-filter:blur(12px); }
    .loader-logo { width:min(245px,80%); height:124px; object-fit:contain; }
    .loader-title { margin:12px 0 5px; color:#172033; font-size:20px; font-weight:850; letter-spacing:-.35px; }
    .loader-copy { margin:0; color:#718096; font-size:13px; }
    .progress { width:100%; height:6px; margin:24px 0 0; overflow:hidden; border-radius:999px; background:#e6f3ed; }
    .progress::after { content:""; display:block; width:38%; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--brand),var(--cyan)); animation:loading 1.1s ease-in-out infinite; }
    .direct-link { display:none; margin-top:18px; color:var(--brand); font-size:12px; font-weight:800; text-decoration:none; }
    .loader.slow .direct-link { display:inline-flex; }
    @keyframes loading { 0%{transform:translateX(-110%)} 100%{transform:translateX(300%)} }
    @media (max-width:920px) { .brand-overlay{display:none} .loader-card{padding:28px 22px 24px;border-radius:22px} .loader-logo{height:106px} }
    @media (prefers-reduced-motion:reduce) { .progress::after{animation-duration:2.2s} .loader{transition:none} }
  </style>
</head>

  <script>
    (function () {

      var favicon = document.getElementById('dashboardFavicon');
      var logoSource = favicon ? favicon.href : '';
